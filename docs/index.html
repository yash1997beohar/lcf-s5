let BYID={};
const $=s=>document.querySelector(s);
const esc=s=>(''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fk=n=>n==null?'—':(Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e3?Math.round(n/1e3)+'k':(''+n));
const inr=n=>'₹'+n.toLocaleString('en-IN');
const arrow=a=>a==='▲'?'<span class="up">▲</span>':a==='▼'?'<span class="dn">▼</span>':'<span class="flat">•</span>';

const colorFor=id=>['--c1','--c2','--c3','--c4','--c5','--c6'][id%6];
const mono=(t,id)=>`<span class="av" style="background:var(${colorFor(id)})">${esc((t||'?').slice(0,2)).toUpperCase()}</span>`;
function tbl(cols,rows,cls){let h=`<div class="tw"><table class="${cls||''}"><thead><tr>`+cols.map(c=>{
   const so=c.sk?' sortable':'',sk=c.sk?` data-sk="${c.sk}"`:'',car=c.sortActive?` <span class="scar">${c.sortAsc?'▴':'▾'}</span>`:'';
   const info=c.tip?` <span class="info" tabindex="0">i<span class="tip">${c.tip}</span></span>`:'';
   return `<th class="${c.cls||''}${so}"${sk}>${c.t}${car}${info}</th>`;}).join('')+'</tr></thead><tbody>';
 rows.forEach(r=>{h+=`<tr${r._id?` data-id="${r._id}"`:''}${r._cls?` class="${r._cls}"`:''}>`+r.cells.map((c,i)=>`<td class="${cols[i].cls||''}">${c}</td>`).join('')+'</tr>'});return h+'</tbody></table></div>'}

const TABS=[];const add=(id,ic,label,render)=>TABS.push({id,ic,label,render});
let STATSORT='total';  // Stats tab: active sort key (high→low). Default = Overall Points.
let MTSEL=null;        // Mini Tournaments tab: selected MT index. null → default to latest.

/* Overall */
add('overall','🏆','League Table',()=>{
 const gl=D.meta.current_gw?('GW'+D.meta.current_gw):'GW';
 const rows=D.overall.map(r=>({_id:r.entry,_cls:r.rank<=5?'top5':'',cells:[
   `${medal(r.rank)} ${arrow(r.arrow)}`,`<b>${esc(r.manager)}</b>`,`<span class="mut">${esc(r.team_name)}</span>`,r.gw_points,`<b>${r.total}</b>`]}));
 return `<div class="ah"><h1>League Table</h1><span class="tag">₹75,000 · top 5</span></div>
  <p class="desc">Ranked by total points, net of transfer hits, highest to lowest. "${gl}" is the latest-gameweek score. Top 5 (highlighted) share the main pool. Tap any manager for their full profile.</p>`+
  tbl([{t:'#'},{t:'Manager'},{t:'Team'},{t:gl,cls:'r'},{t:'Total',cls:'r'}],rows,'clik');
});

/* Prize Board */
add('prizes','💰','Prizes',()=>{
 const o=D.overall,st=D.meta.started;
 const lead=arr=>arr&&arr.length?arr[0]:null;
 const who=t=>t?`<span class="who"><span class="claimed"></span>${esc(t)}</span>`:`<span class="who tbd">—</span>`;
 const stat=txt=>`<span class="who tbd">${txt}</span>`;
 const sec=(title,total,rows)=>`<div class="pcat"><h3>${title}<span>${inr(total)}</span></h3>`+
   rows.map(x=>`<div class="prow"><span class="cat">${x[0]}<span class="amt">${inr(x[1])}</span></span>${x[2]}</div>`).join('')+`</div>`;
 const overallRows=[1,2,3,4,5].map(r=>{const m=o.find(x=>x.rank===r);return [`Overall — ${r===1?'1st':r===2?'2nd':r===3?'3rd':r+'th'}`,PRIZE[r],who(m&&st?m.team_name:null)]});
 const champByNum={},drawByNum={};
 (D.mini||[]).forEach(mt=>{const mm=(mt.name||'').match(/MT\s*(\d+)/i);if(mm){const n=+mm[1];champByNum[n]=(mt.knockout&&mt.knockout.champion)||null;drawByNum[n]=!!mt.has_draw;}});
 const mtRows=[];for(let n=1;n<=6;n++){mtRows.push([`MT${n} Champion`,3000,champByNum[n]?who(champByNum[n]):stat(drawByNum[n]?'in progress':'not started')]);}
 const chipRows=(D.chip_kings||[]).map(c=>[`Chip King — ${c.chip}`,3000,who(c.manager)]);
 const cb=(D.comeback&&D.comeback.board&&D.comeback.board[0])?D.comeback.board[0].manager:null;
 const otherRows=[
   ['League Cup',4000,stat('from ~GW17')],
   ['The Comeback',4000,(D.comeback&&D.comeback.active)?who(cb):stat('from GW20')],
   ['Captaincy King',3000,who(lead(D.captaincy)&&st?lead(D.captaincy).manager:null)],
   ['Green Arrow King',3000,who(lead(D.green)&&st?lead(D.green).manager:null)],
   ['Differential Diamond',3000,who(D.differential&&D.differential.best?D.differential.best.manager:null)],
   ['Pity the Living Dead',2000,who(lead(D.pity)?lead(D.pity).manager:null)]];
 return `<div class="ah"><h1>Prize Board</h1><span class="tag">Total Prize Fund · ₹1,24,000</span></div>
  <p class="desc">All 21 payouts and who's currently in line for each. A green dot marks a live leader; final settlement is after GW38.</p>
  <div class="pgrid">
   ${sec('Overall Champions',75000,overallRows)}
   ${sec('Mini Tournament Champions',18000,mtRows)}
   ${sec('Chip Kings',12000,chipRows)}
   ${sec('Other Rewards',19000,otherRows)}
  </div>`;
});

/* Stats */
add('stats','📊','Stats',()=>{
 if(!D.stats||!D.stats.length)return '<div class="ah"><h1>Season Stats</h1></div><p class="desc">Populates once the season is live.</p>';
 const cm={wildcard:'WC',freehit:'FH',bboost:'BB','3xc':'TC'};
 // "best first": most columns are higher-is-better (desc); these three are lower-is-better (asc).
 const ASC=new Set(['grank','hits_pts','bench']);
 const asc=ASC.has(STATSORT),dir=asc?1:-1;
 const num=r=>{const v=r[STATSORT];return typeof v==='number'?v:null;};
 const srt=D.stats.slice().sort((a,b)=>{const x=num(a),y=num(b);
   if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return dir*(x-y);});
 const rows=srt.map((r,i)=>{const vd=r.value_delta;const vds=vd==null?'—':(vd>0?`<span class="up">+£${vd}m</span>`:vd<0?`<span class="dn">−£${Math.abs(vd)}m</span>`:'£0.0m');
   return {_id:r.entry,cells:[`<span class="rk">${i+1}</span>`,`<b>${esc(r.manager)}</b>`,`<b>${r.total}</b>`,r.avg??'—',
     `${r.above_avg}<span class="mut">/${r.played}</span>`,`<b>${r.cap_return}</b>`,r.high!=null?`${r.high} <span class="mut">GW${r.high_gw}</span>`:'—',
     r.low!=null?`${r.low} <span class="mut">GW${r.low_gw}</span>`:'—',r.transfers,`${r.hits_n} <span class="mut">(−${r.hits_pts})</span>`,r.bench,
     r.value!=null?('£'+r.value+'m'):'—',vds,r.grank!=null?fk(r.grank):'—',
     r.best_jump!=null?`<span class="up">▲${fk(r.best_jump)}</span> <span class="mut">GW${r.best_jump_gw}</span>`:'—',
     (r.chips&&r.chips.length)?r.chips.map(c=>`<span class="chip">${cm[c]||c}</span>`).join(''):'<span class="mut">—</span>']}});
 const SA=k=>STATSORT===k;const AS=k=>ASC.has(k);
 return `<div class="ah"><h1>Season Stats</h1></div><p class="desc">Everything beyond the table. Click any column header to sort — best first, worst last (default: Total). Hover/tap the ⓘ for what a column means. Tap a manager for their profile.</p>
  <div style="overflow-x:auto">`+tbl([{t:'#'},{t:'Manager'},{t:'Total',cls:'r',sk:'total',sortActive:SA('total'),tip:'Cumulative season points, net of transfer hits.'},
   {t:'Avg',cls:'r',sk:'avg',sortActive:SA('avg'),tip:'Average points per gameweek played.'},{t:'Above Avg',cls:'c',sk:'above_avg',sortActive:SA('above_avg'),tip:"Weeks scored above the league's weekly average — consistency. (weeks above / played)."},
   {t:'Cap Ret',cls:'r',sk:'cap_return',sortActive:SA('cap_return'),tip:'Total captain points after the ×2 / ×3 multiplier.'},{t:'High',cls:'r',sk:'high',sortActive:SA('high'),tip:'Best single-GW score and the GW.'},
   {t:'Low',cls:'r',sk:'low',sortActive:SA('low'),tip:'Worst single-GW score and the GW.'},{t:'Transfers',cls:'c',sk:'transfers',sortActive:SA('transfers'),tip:'Total transfers made (free + paid).'},
   {t:'Hits',cls:'c',sk:'hits_pts',sortActive:SA('hits_pts'),sortAsc:true,tip:'Hits for extra transfers: count and points lost, e.g. 2 (−8). Sorts fewest-first.'},{t:'Bench',cls:'c',sk:'bench',sortActive:SA('bench'),sortAsc:true,tip:"Points left on the bench that didn't count. Sorts fewest-first."},
   {t:'Squad',cls:'r',sk:'value',sortActive:SA('value'),tip:'Current team value in £m.'},{t:'Value Δ',cls:'r',sk:'value_delta',sortActive:SA('value_delta'),tip:'Squad value change since GW1.'},
   {t:'Rank',cls:'r',sk:'grank',sortActive:SA('grank'),sortAsc:true,tip:'Current overall global rank. Sorts best (lowest number) first.'},{t:'Best Jump',cls:'r',sk:'best_jump',sortActive:SA('best_jump'),tip:'Biggest one-GW climb in global rank, and the GW.'},{t:'Chips',cls:'c'}],rows,'clik statctr')+'</div>';
});

add('mt','⚔️','Tournaments',()=>{
 if(!D.mini||!D.mini.length)return '<div class="ah"><h1>Mini Tournaments</h1></div><p class="desc">MT1 begins at GW3. Groups and the knockout bracket appear once the draw is made after GW2.</p>';
 const mts=D.mini;
 // default selection = latest drawn MT (config appends new MTs, so the last drawn is the newest)
 if(MTSEL==null||MTSEL<0||MTSEL>=mts.length){let def=mts.length-1;for(let i=mts.length-1;i>=0;i--){if(mts[i].has_draw){def=i;break;}}MTSEL=def;}
 const mt=mts[MTSEL];
 const lbl=(m,i)=>{const mm=(m.name||'').match(/MT\s*(\d+)/i);return mm?('MT'+mm[1]):('MT'+(i+1));};
 const pills=mts.length>1?`<div class="seg mtsel">`+mts.map((m,i)=>`<button class="mtpill${i===MTSEL?' on':''}" data-mti="${i}">${lbl(m,i)}</button>`).join('')+`</div>`:'';
 const done=mt.knockout&&mt.knockout.champion;
 const status=done?`<span class="pill">completed</span>`:(mt.has_draw?`<span class="live"><span class="dot"></span>in progress</span>`:`<span class="pill">not started</span>`);
 let h=`<div class="ah"><h1>${esc(mt.name)}</h1><span class="tag">₹3,000</span>${status}</div>
  ${pills}
  <p class="desc">Top 24 · 6 groups of 4 · group stage GW ${mt.group_gws.join(', ')} → knockouts GW ${mt.ko_gws.join(', ')}.</p>
  <div class="seg"><button id="tf" class="on">Fixtures</button><button id="tg">Standings</button><button id="tk">Knockouts</button></div>
  <div id="mfx"></div><div id="mgrp" style="display:none"></div><div id="mko" style="display:none"></div>`;
 setTimeout(()=>{
  const f=$('#mfx'),g=$('#mgrp'),k=$('#mko');
  f.innerHTML=fixturesView(mt);
  if(!mt.has_draw)g.innerHTML='<p class="desc">Awaiting the random group draw.</p>';
  else{let gh='<div class="pgrid">';Object.entries(mt.groups).forEach(([gn,t])=>{
    const rows=t.map((r,i)=>({_cls:i<2?'top5':'',cells:[r[0],r[1].P,r[1].W,r[1].D,r[1].L,`<b>${r[1].pts}</b>`,r[1].fpl]}));
    gh+=`<div><div class="charttitle">Group ${gn}</div>`+tbl([{t:'Team'},{t:'P',cls:'c'},{t:'W',cls:'c'},{t:'D',cls:'c'},{t:'L',cls:'c'},{t:'Pts',cls:'c'},{t:'TB1',cls:'c',tip:'TB1 — total FPL points scored across the group gameweeks so far. Teams level on Pts are separated by: 1) Pts, 2) TB1 (total points), 3) head-to-head result, 4) highest single-GW score.'}],rows,'grptbl')+'</div>';});
   g.innerHTML=gh+'</div>';}
  k.innerHTML=koHeader(mt)+bracket(mt.knockout);
  const panes={tf:f,tg:g,tk:k};
  ['tf','tg','tk'].forEach(id=>$('#'+id).onclick=()=>{['tf','tg','tk'].forEach(x=>{$('#'+x).classList.toggle('on',x===id);panes[x].style.display=x===id?'':'none'})});
 });
 return h;
});
function koHeader(mt){
 const swapped=mt.knockout&&mt.knockout.reseeded;
 return `<div class="ah"><h1 style="font-size:16px">Knockouts</h1>`+
  `<span class="info" tabindex="0" style="width:16px;height:16px;font-size:10px">i`+
  `<span class="tip" style="width:250px"><b>How the 8-team bracket is set</b><br>`+
  `The 8 qualifiers are the 6 group winners plus the 2 best runners-up. Cross-group ranking uses Points → total FPL → highest single-GW score (head-to-head can't apply between groups). `+
  `Winners take seeds 1–6 by group-stage record; the 2 runners-up are seeds 7–8. `+
  `Pairings: 1v8, 2v7, 3v6, 4v5. If a pairing would replay a group match, the two runners-up swap seeds to avoid it`+
  (swapped?` <em>— applied this round.</em>`:`.`)+
  `</span></span></div>`;
}
function bracket(ko){if(!ko||!ko.rounds)return '<p class="desc">The 8-team knockout (QF → SF → Final) appears once the group stage finishes.</p>';
 const hasChamp=!!ko.champion, nR=ko.rounds.length;
 let h='<div class="brk">';
 ko.rounds.forEach((rd,i)=>{
  const isLast=!hasChamp&&i===nR-1;           // rightmost column when no champion crowned yet
  const cls='brd'+(i>0?' recv':'')+(isLast?' last':'');   // recv = receives a pair → draws the elbow spine
  h+=`<div class="${cls}"><div class="rn">${esc(rd.name)}</div><div class="ties">`;
  rd.ties.forEach(t=>{const aw=t.winner==='a',bw=t.winner==='b';
   h+=`<div class="tie"><div class="tiecard">`+
      `<div class="side"><span class="${aw?'':'mut'}"><b>${esc(t.a||'—')}</b></span><b class="${aw?'pz':'mut'}">${t.sa??''}</b></div>`+
      `<div class="side"><span class="${bw?'':'mut'}"><b>${esc(t.b||'—')}</b></span><b class="${bw?'pz':'mut'}">${t.sb??''}</b></div>`+
      `</div></div>`});
  h+='</div></div>';
 });
 if(hasChamp){
  h+=`<div class="brd last champcol"><div class="rn">Champion</div><div class="ties">`+
     `<div class="tie"><div class="champbox"><span class="cup">🏆</span><span class="pz">${esc(ko.champion)}</span></div></div>`+
     `</div></div>`;
 }
 return h+'</div>';}
function fixturesView(mt){
 if(!mt.fixtures||!mt.fixtures.length) return '<p class="desc">Fixtures appear once the group draw is set.</p>';
 const fin=D.meta.finished||[];
 const byGw={}; mt.fixtures.forEach(f=>{(byGw[f.gw]=byGw[f.gw]||[]).push(f)});
 let h='';
 Object.keys(byGw).map(Number).sort((a,b)=>a-b).forEach(gw=>{
   const tag=fin.includes(gw)?'<span class="pill">completed</span>':'<span class="live"><span class="dot"></span>upcoming</span>';
   h+=`<div class="fxgw"><div class="ah"><h1 style="font-size:16px">Gameweek ${gw}</h1>${tag}</div><div class="fxwrap">`;
   const grp={}; byGw[gw].forEach(f=>{(grp[f.group]=grp[f.group]||[]).push(f)});
   Object.keys(grp).sort().forEach(g=>{
     h+=`<div class="fxg"><h4>Group ${g}</h4>`;
     grp[g].forEach(f=>{const aw=f.winner==='a',bw=f.winner==='b',played=f.winner!=null;
       const sc=played?`<span class="sc">${f.sa} – ${f.sb}</span>`:`<span class="vs">vs</span>`;
       h+=`<div class="fx"><span class="l ${played?(aw?'win':'lo'):''}">${esc(f.a)}</span>${sc}<span class="rr ${played?(bw?'win':'lo'):''}">${esc(f.b)}</span></div>`;});
     h+='</div>';});
   h+='</div></div>';
 });
 return h;
}

/* simple prize-leaderboard tabs */
function board(title,tag,desc,cols,rows){return `<div class="ah"><h1>${title}</h1><span class="tag">${tag}</span></div><p class="desc">${desc}</p>`+tbl(cols,rows,'clik');}
add('chips','🃏','Chips',()=>{let h='<div class="ah"><h1>Chip Kings</h1><span class="tag">₹3,000 each</span></div><p class="desc">Best single-GW return with each chip, across either half of the season.</p><div class="tiles">';
 D.chip_kings.forEach(c=>{h+=`<div class="tile"><div class="k">${c.chip}</div><div class="v">${c.score!=null?c.score:'—'}</div><div class="d">${c.manager?esc(c.manager)+' · GW'+c.gw:'not played yet'}</div></div>`});return h+'</div>';});
add('cap','🧢','Captaincy',()=>board('Captaincy King','₹3,000','Total captain points after multipliers. Top-5 overall excluded at settlement.',
 [{t:'#'},{t:'Manager'},{t:'Captain Pts',cls:'r'}],D.captaincy.map((r,i)=>({_id:r.entry,cells:[`<span class="rk">${i+1}</span>`,`<b>${esc(r.manager)}</b>`+(r.excluded?' <span class="chip">top-5 excl</span>':''),`<b>${r.points}</b>`]}))));
add('arrows','📈','Green Arrows',()=>board('Green Arrow King','₹3,000','Gameweeks where overall (global) rank improved. Top-5 overall excluded.',
 [{t:'#'},{t:'Manager'},{t:'Arrows',cls:'r'}],D.green.map((r,i)=>({_id:r.entry,cells:[`<span class="rk">${i+1}</span>`,`<b>${esc(r.manager)}</b>`+(r.excluded?' <span class="chip">top-5 excl</span>':''),`<b>${r.arrows}</b>`]}))));
add('diamond','💎','Differential',()=>{if(!D.differential.has_snapshots)return '<div class="ah"><h1>Differential Diamond</h1><span class="tag">₹3,000</span></div><p class="desc">Ownership snapshots begin at GW1.</p>';
 let h='<div class="ah"><h1>Differential Diamond</h1><span class="tag">₹3,000</span></div><p class="desc">Biggest single-GW haul from a starter owned under 7.5% (ownership at the deadline).</p>';
 if(D.differential.best){const b=D.differential.best;h+=`<div class="tiles"><div class="tile"><div class="k">Current leader</div><div class="v">${b.points} pts</div><div class="d">${esc(b.manager)} · ${esc(b.player)} · GW${b.gw} · ${b.own}%</div></div></div>`}
 return h+tbl([{t:'#'},{t:'Manager'},{t:'Player'},{t:'GW',cls:'c'},{t:'Pts',cls:'r'},{t:'Own',cls:'r'}],D.differential.board.map((r,i)=>({cells:[`<span class="rk">${i+1}</span>`,esc(r.manager),`<b>${esc(r.player)}</b>`,'GW'+r.gw,`<b>${r.points}</b>`,r.own+'%']})));});
add('comeback','🔥','Comeback',()=>{if(!D.comeback.active)return '<div class="ah"><h1>The Comeback</h1><span class="tag">₹4,000</span></div><p class="desc">Activates after GW19 — the bottom 21 race for most points across GW20–GW38.</p>';
 return board('The Comeback','₹4,000','Bottom 21 after GW19 · most points GW20–38 wins.',[{t:'#'},{t:'Manager'},{t:'Pts since GW20',cls:'r'}],
  D.comeback.board.map((r,i)=>({_id:r.entry,_cls:i==0?'top5':'',cells:[medal(i+1),`<b>${esc(r.manager)}</b>`,`<b>${r.points}</b>`]})));});
add('pity','💀','Pity',()=>board('Pity the Living Dead','₹2,000','Lowest valid GW score (to GW30). Auto-checks hits ≤ 8 and ruled-out starters ≤ 2; admins confirm edge cases.',
 [{t:'#'},{t:'Manager'},{t:'GW',cls:'c'},{t:'Score',cls:'r'},{t:'Hit',cls:'c'},{t:'Ruled-out',cls:'c'},{t:'Valid',cls:'c'}],
 D.pity.map((r,i)=>({cells:[`<span class="rk">${i+1}</span>`,`<b>${esc(r.manager)}</b>`,'GW'+r.gw,`<b>${r.score}</b>`,r.hit?('−'+r.hit):'0',r.ruled_out==null?'n/a':r.ruled_out,r.valid?'<span class="up">✓</span>':'<span class="dn">review</span>']}))));

function findId(name){const o=D.overall.find(x=>x.manager===name);return o?o.entry:0}

/* H2H */
add('h2h','🆚','H2H',()=>{
 const opts=D.overall.map(o=>`<option value="${o.entry}">${esc(o.team_name)} — ${esc(o.manager)}</option>`).join('');
 return `<div class="ah"><h1>Head-to-Head</h1></div><p class="desc">Compare any two managers gameweek by gameweek — who won more weeks, best weeks, and the season gap.</p>
  <div class="h2pick">
   <div class="h2side"><label>Manager A</label><select class="sel" id="ha">${opts}</select></div>
   <span class="vs">VS</span>
   <div class="h2side"><label>Manager B</label><select class="sel" id="hb">${opts}</select></div>
  </div><div id="hout"></div>`;
});
function wireH2H(){const a=$('#ha'),b=$('#hb');if(!a||!b)return;if(D.overall[1])b.value=D.overall[1].entry;
 const upd=()=>{$('#hout').innerHTML=h2r(+a.value,+b.value)};a.onchange=upd;b.onchange=upd;upd();}
function ser(id){return (D.series&&D.series[id])||[]}
function h2r(ida,idb){const A=BYID[ida],B=BYID[idb];if(!A||!B)return'';if(ida===idb)return '<p class="desc">Pick two different managers.</p>';
 const sa=ser(ida),sb=ser(idb);const gws=sa.map(x=>x.gw).filter(g=>sb.some(y=>y.gw===g));
 let wa=0,wb=0,dr=0;const strip=gws.map(g=>{const na=sa.find(x=>x.gw===g).net,nb=sb.find(y=>y.gw===g).net;
  if(na>nb){wa++;return '<span class="h2b a" title="GW'+g+'">a</span>'}if(nb>na){wb++;return '<span class="h2b b" title="GW'+g+'">b</span>'}dr++;return '<span class="h2b d">d</span>'}).join('');
 const bestA=sa.length?Math.max(...sa.map(x=>x.net)):'—',bestB=sb.length?Math.max(...sb.map(x=>x.net)):'—';
 const gap=Math.abs((A.total||0)-(B.total||0));
 const col=(m,w,best,side)=>`<div class="h2col ${side}">${mono(m.team_name,m.entry)}<div class="nm">${esc(m.manager)}</div><div class="mut">${esc(m.team_name)}</div>
  <div class="big">${m.total??'—'}</div><div class="mut">total pts</div><div class="ss"><span>#${m.rank} rank</span><span>${best} best GW</span><span>${w} GW wins</span></div></div>`;
 return `<div class="h2wrap">${col(A,wa,bestA,'a')}<div class="h2mid"><div class="h2rec">${wa}<span>–</span>${dr}<span>–</span>${wb}</div><div class="mut">W–D–L by GW</div><div class="h2gap">${gap} pt gap</div></div>${col(B,wb,bestB,'b')}</div>
  <div class="h2strip">${strip}</div><div class="charttitle" style="text-align:center;margin-top:10px">${gws.length} gameweeks compared · net-of-hits · <span style="color:var(--blue)">■</span> ${esc(A.manager)} &nbsp; <span style="color:var(--gold)">■</span> ${esc(B.manager)}</div>`;}

/* ---- profile modal + rank chart ---- */
function sparkline(pts,{h=140,color='var(--blue)',invert=false,yfmt=(v=>v)}={}){
 if(!pts.length)return '<div class="mut" style="padding:10px 0">No gameweeks yet.</div>';
 const w=520,ml=48,mr=12,mt=12,mb=20;
 const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
 let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}
 const px=x=>x1===x0?(ml+(w-ml-mr)/2):ml+(x-x0)/(x1-x0)*(w-ml-mr);
 const py=y=>{const t=(y-y0)/(y1-y0);return mt+(invert?t:(1-t))*(h-mt-mb)};
 const d=pts.map((p,i)=>(i?'L':'M')+px(p.x).toFixed(1)+' '+py(p.y).toFixed(1)).join(' ');
 const dots=pts.map(p=>`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.6" fill="${color}"><title>GW${p.x}: ${yfmt(p.y)}</title></circle>`).join('');
 const gl=[mt,(mt+h-mb)/2,h-mb].map(yy=>`<line x1="${ml}" y1="${yy.toFixed(1)}" x2="${w-mr}" y2="${yy.toFixed(1)}" stroke="var(--hair)"/>`).join('');
 const top=invert?y0:y1,bot=invert?y1:y0;
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${gl}
  <text x="${ml-6}" y="${mt+4}" font-size="9" fill="var(--mut)" text-anchor="end">${yfmt(top)}</text>
  <text x="${ml-6}" y="${h-mb+3}" font-size="9" fill="var(--mut)" text-anchor="end">${yfmt(bot)}</text>
  <text x="${ml}" y="${h-4}" font-size="9" fill="var(--mut)" text-anchor="start">GW${x0}</text>
  <text x="${w-mr}" y="${h-4}" font-size="9" fill="var(--mut)" text-anchor="end">GW${x1}</text>
  <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>${dots}</svg>`;}
function bars(pts,{h=132,color='var(--gold)'}={}){if(!pts.length)return '';
 const w=520,ml=32,mr=10,mt=10,mb=18,max=Math.max(...pts.map(p=>p.y))||1,iw=w-ml-mr,bw=iw/pts.length,step=Math.max(1,Math.ceil(pts.length/9));
 let bar='',lab='';
 pts.forEach((p,i)=>{const bh=(p.y/max)*(h-mt-mb),x=ml+i*bw;
  bar+=`<rect x="${(x+bw*0.16).toFixed(1)}" y="${(h-mb-bh).toFixed(1)}" width="${(bw*0.68).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}"><title>GW${p.x}: ${p.y}</title></rect>`;
  if(i%step===0||i===pts.length-1)lab+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-4}" font-size="8.5" fill="var(--mut)" text-anchor="middle">${p.x}</text>`;});
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
  <text x="${ml-5}" y="${mt+6}" font-size="9" fill="var(--mut)" text-anchor="end">${max}</text>
  <line x1="${ml}" y1="${h-mb}" x2="${w-mr}" y2="${h-mb}" stroke="var(--hair)"/>${bar}${lab}</svg>`;}
function openProfile(id){
 const m=BYID[id];const prof=(D.profiles||[]).find(p=>(p.entry||findId(p.manager))===id);const st=(D.stats||[]).find(x=>x.entry===id);const s=ser(id);
 if(!m&&!prof)return;const name=m?m.manager:prof.manager,team=m?m.team_name:prof.team_name;
 const nets=s.map(p=>p.net),caps=s.reduce((a,p)=>a+(p.cap||0),0);
 const best=nets.length?Math.max(...nets):'—',worst=nets.length?Math.min(...nets):'—',avg=nets.length?Math.round(nets.reduce((a,b)=>a+b,0)/nets.length):'—';
 const rankPts=s.filter(p=>p.orank!=null).map(p=>({x:p.gw,y:p.orank}));
 const netPts=s.map(p=>({x:p.gw,y:p.net}));
 const cma=n=>n==null?'—':(''+n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
 const stat=(k,v,sub)=>`<div class="ms"><div class="k">${k}</div><div class="v">${v}</div>${sub?`<div class="ssub">${sub}</div>`:''}</div>`;
 $('#modal').innerHTML=`<div class="mh">${mono(team,id)}<div><div class="nm">${esc(name)}</div><div class="tm">${esc(team)}${m?' · #'+m.rank+' in league':''}</div></div><button class="mx" onclick="closeM()">✕</button></div>
  <div class="mbody"><div class="mgrid">
   ${stat('Total',m?m.total:'—')}${stat('Avg GW',avg)}${stat('Best GW',best)}${stat('Worst GW',worst)}${stat('Captain pts',caps||(st?st.cap_return:'—'))}
   ${prof?stat('Seasons',prof.seasons):''}${prof&&prof.best_rank?stat('Best rank',cma(prof.best_rank),prof.best_season||''):''}${prof&&prof.avg_rank?stat('Avg rank',cma(prof.avg_rank),(prof.past_seasons||0)+' seasons'):''}${prof&&prof.last_rank?stat('Last season',cma(prof.last_rank),prof.last_season||''):''}</div>
   ${s.length?(`<div class="charttitle">Global rank through the season — rank 1 is best, so a rising line means climbing</div>${sparkline(rankPts,{color:'var(--blue)',invert:true,yfmt:fk})}<div class="charttitle" style="margin-top:14px">Gameweek scores</div>${bars(netPts)}`):'<div class="mut" style="padding:12px 2px">📈 Rank and gameweek-score charts appear once GW1 has been played.</div>'}</div>`;
 $('#ov').classList.add('on');
}
window.closeM=()=>$('#ov').classList.remove('on');

/* ---- build ---- */
function buildUI(){
 BYID={};(D.overall||[]).forEach(o=>BYID[o.entry]=o);
 const nav=$('#nav'),main=$('#main');nav.innerHTML='';main.innerHTML='';
 TABS.forEach((t,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${t.ic}</span>${t.label}`;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('main section').forEach(x=>x.classList.remove('on'));
   b.classList.add('on');document.getElementById('sec_'+t.id).classList.add('on');window.scrollTo({top:0,behavior:'smooth'});
   if(t.id==='h2h')wireH2H();};
  nav.appendChild(b);
  const sec=document.createElement('section');if(i===0)sec.className='on';sec.id='sec_'+t.id;sec.innerHTML=t.render();main.appendChild(sec);});
 const m=D.meta;
 $('#hpills').innerHTML=`<span class="pill"><b>${m.n_members}</b> managers</span>`+
  `<span class="pill">${m.current_gw?('GW'+m.current_gw):'Pre-Season'}</span>`+
  (m.bonus_pending?'<span class="live"><span class="dot"></span>bonus confirming</span>':(m.started?'<span class="live"><span class="dot"></span>live</span>':''));
 const ago=()=>{if(!m.generated_iso)return m.generated_utc||'';const diff=(Date.now()-new Date(m.generated_iso).getTime())/60000;return diff<1?'just now':diff<60?Math.round(diff)+'m ago':Math.round(diff/60)+'h ago';};
 const stale=m.generated_iso&&(Date.now()-new Date(m.generated_iso).getTime())>3*3600*1000;
 $('#foot').innerHTML=`${m.started?'Live data':'Pre-Season'} · updated ${ago()} · auto-refreshes every 2h${stale?' · <span class="warn">⚠ data looks stale</span>':''} · League ${m.league_id}${m.demo?' · <b>DEMO</b>':''}`;
 $('#dl').onclick=()=>location.href=(m.xlsx||'Laxmi_Chit_Fund_S5_audit.xlsx');
}
// document-level listeners (added once)
document.addEventListener('click',e=>{
 const info=e.target.closest('.info');
 document.querySelectorAll('.info.open').forEach(x=>{if(x!==info)x.classList.remove('open')});
 if(info){e.stopPropagation();e.preventDefault();info.classList.toggle('open');return;}
 const sh=e.target.closest('th.sortable');
 if(sh&&sh.closest('#sec_stats')&&sh.dataset.sk){STATSORT=sh.dataset.sk;const sec=document.getElementById('sec_stats');const st=TABS.find(t=>t.id==='stats');if(sec&&st)sec.innerHTML=st.render();return;}
 const mp=e.target.closest('.mtpill');
 if(mp&&mp.dataset.mti!=null){MTSEL=+mp.dataset.mti;const sec=document.getElementById('sec_mt');const mtt=TABS.find(t=>t.id==='mt');if(sec&&mtt)sec.innerHTML=mtt.render();return;}
 const tr=e.target.closest('tr[data-id]');if(tr){openProfile(+tr.dataset.id);return;}
 if(e.target.id==='ov')closeM();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
buildUI();
// theme
const root=document.documentElement,tb=$('#theme');
function setT(t){root.setAttribute('data-theme',t);tb.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('lcf-theme',t)}catch(e){}}
let sv=null;try{sv=localStorage.getItem('lcf-theme')}catch(e){}
setT(sv||'dark');
tb.onclick=()=>setT(root.getAttribute('data-theme')==='dark'?'light':'dark');

/* Always pull the freshest data (cache-busted). If the page itself was served stale
   from cache, re-render with the newer data. Falls back silently (e.g. local preview). */
fetch('data.json?t='+Date.now(),{cache:'no-store'})
  .then(r=>r.ok?r.json():null)
  .then(d=>{ if(d&&d.meta&&d.meta.generated_iso&&d.meta.generated_iso!==D.meta.generated_iso){ D=d; buildUI(); } })
  .catch(()=>{});
