name: Update FPL dashboard

on:
  schedule:
    - cron: '0 */2 * * *'      # every 2 hours (UTC); catches deadline snapshots + post-GW results
  workflow_dispatch:            # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python fpl_tracker.py
      - name: Commit refreshed data
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update standings $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "no changes to commit"
          git push
